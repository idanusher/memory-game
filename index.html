<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק זיכרון - חוק שוויון זכויות (עם תמונות)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Assistant:wght@400;600&display=swap');

    :root {
      --primary-color: #2b6cb0;
      --secondary-color: #ed8936;
      --bg-color: #f7fafc;
      --law-bg: #eebf;
      --scenario-bg: #feebc8;
      --card-back-bg: #2d3748;
      --success-color: #48bb78;
      --text-main: #2d3748;
      --text-light: #718096;
    }

    body {
      font-family: 'Assistant', 'Heebo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-family: 'Heebo', sans-serif;
      color: var(--primary-color);
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background-color: #2c5282;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
    
    .stats {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .game-board {
      display: flex;
      flex-direction: row;
      gap: 40px;
      width: 100%;
      max-width: 1200px;
      justify-content: center;
    }

    .board-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .column-title {
      font-family: 'Heebo', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid;
      width: 100%;
      text-align: center;
    }

    .law-col .column-title {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .scenario-col .column-title {
      color: var(--secondary-color);
      border-color: var(--secondary-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
    }

    /* Card styling */
    .card {
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    .card.flipped .card-inner, .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .card-front {
      background-color: var(--card-back-bg);
      background-image: radial-gradient(circle at 10px 10px, rgba(255,255,255,0.1) 2px, transparent 0);
      background-size: 20px 20px;
      border: 2px solid rgba(255,255,255,0.1);
    }
    
    .card-front::after {
      content: '?';
      font-family: 'Heebo', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: rgba(255,255,255,0.4);
    }

    .card-back {
      transform: rotateY(180deg);
      border: 2px solid;
      flex-direction: column;
      overflow-y: auto;
    }
    
    /* Hide scrollbar for clean look */
    .card-back::-webkit-scrollbar {
      display: none;
    }
    .card-back {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .card-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      word-wrap: break-word;
      width: 100%;
    }

    .law-card .card-back {
      background-color: #ebf8ff;
      border-color: #63b3ed;
      color: #2a4365;
    }

    .scenario-card .card-back {
      background-color: #fffaf0;
      border-color: #fbd38d;
      color: #7b341e;
    }
    
    .card.matched .card-back {
      background-color: #f0fff4;
      border-color: #68d391;
      color: #22543d;
      box-shadow: 0 0 15px rgba(72, 187, 120, 0.4);
    }

    /* Modal styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      max-width: 500px;
      width: 90%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-top: 8px solid var(--success-color);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      color: var(--success-color);
      font-family: 'Heebo', sans-serif;
      font-size: 2rem;
      margin: 0 0 15px 0;
    }
    
    .modal-title-win {
      color: var(--primary-color);
    }

    .modal-text {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 25px;
      color: var(--text-main);
    }
    
    .law-reference {
      background-color: #f7fafc;
      padding: 15px;
      border-radius: 8px;
      border-right: 4px solid var(--primary-color);
      margin-bottom: 25px;
      font-weight: 600;
      text-align: right;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .game-board {
        flex-direction: column;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .column-title {
        font-size: 1.5rem;
      }
      .card-text {
        font-size: 0.9rem;
      }
    }
    
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .card-text {
        font-size: 0.75rem;
      }
    }

    /* ===== v4: embedded images from document.docx ===== */

    .grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .card {
      aspect-ratio: 1 / 1;
    }

    .card-back {
      justify-content: flex-start;
      gap: 8px;
      padding: 12px;
    }

    .card-back > .card-text {
      margin: auto 0;
    }

    .card-images {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
      height: 62%;
      flex-shrink: 0;
      min-height: 0;
    }

    .card-images img {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .scenario-card .card-text {
      font-size: 0.95rem;
      margin: 0;
    }

    .card-title {
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .card-quote {
      font-weight: 400;
      font-size: 0.95rem;
    }

    .modal-images {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .modal-images:empty {
      display: none;
    }

    .modal-images img {
      max-width: 100%;
      max-height: 220px;
      min-width: 0;
      flex: 0 1 auto;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .card {
        aspect-ratio: 1 / 1;
      }
      .scenario-card .card-text, .card-quote {
        font-size: 0.8rem;
      }
      .card-title {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 600px) {
      .card-images {
        height: 55%;
      }
      .scenario-card .card-text, .card-quote {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>משחק זיכרון - חוק שוויון זכויות</h1>
    <div class="controls">
      <button id="restart-btn">התחל משחק חדש</button>
      <div class="stats">זוגות שנמצאו: <span id="score-display">0</span> / <span id="total-display">0</span></div>
    </div>
  </header>

  <div class="game-board">
    <!-- Laws Column (Right due to RTL) -->
    <div class="board-column law-col">
      <div class="column-title">נוסח החוק / עקרונות</div>
      <div class="grid" id="law-grid"></div>
    </div>

    <!-- Scenarios Column (Left due to RTL) -->
    <div class="board-column scenario-col">
      <div class="column-title">מקרה / תרחיש</div>
      <div class="grid" id="scenario-grid"></div>
    </div>
  </div>

  <!-- Match Modal -->
  <div class="modal-overlay" id="match-modal">
    <div class="modal-content">
      <h2 class="modal-title">התאמה מושלמת!</h2>
      <div class="modal-images" id="modal-images"></div>
      <div class="law-reference" id="modal-explanation"></div>
      <button id="close-modal-btn">המשך במשחק</button>
    </div>
  </div>

  <!-- Win Modal -->
  <div class="modal-overlay" id="win-modal">
    <div class="modal-content" style="border-top-color: var(--primary-color);">
      <h2 class="modal-title modal-title-win">כל הכבוד!</h2>
      <p class="modal-text">סיימתם את המשחק בהצלחה והתאמתם את כל התרחישים לעקרונות החוק.</p>
      <p class="modal-text" style="font-weight: 600;">מספר ניסיונות: <span id="attempts-display">0</span></p>
      <button id="play-again-btn">שחקו שוב</button>
    </div>
  </div>

    // State variables
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchesFound = 0;
    let attempts = 0;

    // DOM Elements
    const lawGrid = document.getElementById('law-grid');
    const scenarioGrid = document.getElementById('scenario-grid');
    const scoreDisplay = document.getElementById('score-display');
    const attemptsDisplay = document.getElementById('attempts-display');
    const matchModal = document.getElementById('match-modal');
    const winModal = document.getElementById('win-modal');
    const modalExplanation = document.getElementById('modal-explanation');
    
    // Auto-close modal timeout ID
    let autoCloseTimeout;

    // Initialize game
    function initGame() {
      // Reset state
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      matchesFound = 0;
      attempts = 0;
      scoreDisplay.textContent = '0';
      document.getElementById('total-display').textContent = pairsData.length;
      matchModal.classList.remove('active');
      winModal.classList.remove('active');
      clearTimeout(autoCloseTimeout);

      lawGrid.innerHTML = '';
      scenarioGrid.innerHTML = '';

      // Prepare cards array for Laws and Scenarios separately
      const lawCards = [];
      const scenarioCards = [];

      pairsData.forEach((pair, index) => {
        lawCards.push({
          uid: `law_${index}`,
          matchId: pair.id,
          type: 'law',
          text: pair.law,
          explanation: pair.explanation,
          images: pair.images
        });
        
        scenarioCards.push({
          uid: `scenario_${index}`,
          matchId: pair.id,
          type: 'scenario',
          text: pair.scenario,
          explanation: pair.explanation,
          images: pair.images
        });
      });

      // Shuffle arrays
      shuffleArray(lawCards);
      shuffleArray(scenarioCards);

      // Render cards
      lawCards.forEach(cardData => {
        lawGrid.appendChild(createCardElement(cardData));
      });
      
      scenarioCards.forEach(cardData => {
        scenarioGrid.appendChild(createCardElement(cardData));
      });
    }

    // Create card DOM element
    function createCardElement(cardData) {
      const card = document.createElement('div');
      card.classList.add('card', `${cardData.type}-card`);
      card.dataset.matchId = cardData.matchId;
      card.dataset.type = cardData.type;
      card.dataset.explanation = cardData.explanation;
      card.imageList = cardData.images;

      const inner = document.createElement('div');
      inner.classList.add('card-inner');

      const front = document.createElement('div');
      front.classList.add('card-face', 'card-front');

      const back = document.createElement('div');
      back.classList.add('card-face', 'card-back');
      
      if (cardData.type === 'scenario' && cardData.images && cardData.images.length) {
        const imgRow = document.createElement('div');
        imgRow.classList.add('card-images');
        cardData.images.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          imgRow.appendChild(img);
        });
        back.appendChild(imgRow);
      }

      const textElement = document.createElement('div');
      textElement.classList.add('card-text');
      const colon = cardData.text.indexOf(':');
      if (cardData.type === 'law' && colon > 0) {
        const title = document.createElement('div');
        title.classList.add('card-title');
        title.textContent = cardData.text.slice(0, colon);
        const body = document.createElement('div');
        body.classList.add('card-quote');
        body.textContent = cardData.text.slice(colon + 1).trim();
        textElement.appendChild(title);
        textElement.appendChild(body);
      } else {
        textElement.textContent = cardData.text;
      }
      
      back.appendChild(textElement);
      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);

      card.addEventListener('click', flipCard);
      return card;
    }

    // Card click handler
    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;
      if (this.classList.contains('matched')) return;

      this.classList.add('flipped');

      if (!firstCard) {
        // First click
        firstCard = this;
        return;
      }

      // Second click
      secondCard = this;
      
      // Prevent selecting two cards from the SAME column
      if (firstCard.dataset.type === secondCard.dataset.type) {
        firstCard.classList.remove('flipped');
        firstCard = this;
        secondCard = null;
        return;
      }

      checkForMatch();
    }

    // Check match logic
    function checkForMatch() {
      attempts++;
      let isMatch = firstCard.dataset.matchId === secondCard.dataset.matchId;

      if (isMatch) {
        disableCards();
      } else {
        unflipCards();
      }
    }

    // Handle match
    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      
      const explanation = firstCard.dataset.type === 'law' 
                          ? firstCard.dataset.explanation 
                          : secondCard.dataset.explanation;
                          
      matchesFound++;
      scoreDisplay.textContent = matchesFound;
      
      showMatchModal(explanation, firstCard.imageList);
      
      resetBoard();

      if (matchesFound === pairsData.length) {
        setTimeout(showWinModal, 1000);
      }
    }

    // Handle mismatch - INCREASED DELAY TO 4 SECONDS
    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();
      }, 4000); 
    }

    // Reset selection state
    function resetBoard() {
      [firstCard, secondCard, lockBoard] = [null, null, false];
    }
    
    // Show Modal on Match - INCREASED TIMEOUT TO 12 SECONDS
    function showMatchModal(explanation, images) {
      modalExplanation.textContent = explanation;
      const modalImages = document.getElementById('modal-images');
      modalImages.innerHTML = '';
      (images || []).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        modalImages.appendChild(img);
      });
      matchModal.classList.add('active');
      
      // Auto close after 12 seconds
      clearTimeout(autoCloseTimeout);
      autoCloseTimeout = setTimeout(() => {
        closeMatchModal();
      }, 12000); 
    }
    
    function closeMatchModal() {
      matchModal.classList.remove('active');
      clearTimeout(autoCloseTimeout);
    }
    
    // Show Win Modal
    function showWinModal() {
      attemptsDisplay.textContent = attempts;
      winModal.classList.add('active');
    }

    // Fisher-Yates shuffle algorithm
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Event Listeners
    document.getElementById('restart-btn').addEventListener('click', initGame);
    document.getElementById('play-again-btn').addEventListener('click', initGame);
    document.getElementById('close-modal-btn').addEventListener('click', closeMatchModal);
    
    // Allow closing modal by clicking outside
    matchModal.addEventListener('click', function(e) {
      if(e.target === this) {
        closeMatchModal();
      }
    });

    // Start game on load
    window.addEventListener('DOMContentLoaded', initGame);

  </script>
